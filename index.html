
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Surprise for You 💗</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg,#ffe0ed,#e8ddff);
  color: #803b62;
}
.card {
  width: 82%;
  max-width: 420px;
  padding: 30px 20px;
  border-radius: 25px;
  background: white;
  box-shadow: 0 10px 40px #c77aa755;
}
.emoji { font-size: 65px; }
h1 { color: #e65391; }
button {
  border: 0;
  padding: 15px 22px;
  border-radius: 30px;
  background: #f05b9d;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
.hidden { display: none; }
#surprise {
  width: 90%;
  max-width: 650px;
  padding: 20px;
  border-radius: 20px;
  background: #21142b;
  color: white;
}
#surprise h1 { color: #ff8fc7; }
iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="card" id="welcome">
  <div class="emoji">🎀</div>
  <h1>Hey, sis! 💗</h1>
  <p>I made a tiny surprise just for you! 🥹💕</p>
  <p>You HAVE to open it. No cheating! 🤭</p>
  <button onclick="rickroll()">Open your surprise 🎁</button>
  <p>Made with love 💖</p>
</div>

<div id="surprise" class="hidden">
  <h1>HAHAHAHA GOT YOU 💀</h1>
  <p>YOU JUST GOT RICKROLLED 😂</p>
  <iframe id="video" title="Never Gonna Give You Up"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen></iframe>
  <p>Never gonna let you live this down 😭</p>
  <button onclick="rickroll()">Again 💀</button>
</div>

<script>
function rickroll() {
  document.getElementById("video").src =
  "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1";
    "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1";
  document.body.style.background =
    "linear-gradient(135deg,#25112f,#531c51)";
}
</script>
</body>
</html>
